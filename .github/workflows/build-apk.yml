name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # यहाँ हमने 'node-size' की गलती सुधारी और नया वर्जन v24 सेट किया
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    # अगर आपकी रिपोजिटरी में package.json नहीं है, तो यह खुद एक बेसिक फाइल बना देगा ताकि बिल्ड क्रैश न हो
    - name: Create package.json if missing
      run: |
        if [ ! -f package.json ]; then
          npm init -y
        fi

    - name: Install Dependencies
      run: |
        npm install
        npm install @capacitor/core @capacitor/cli @capacitor/android

    - name: Build Android Project
      run: |
        npx cap init "My Pocket App" "com.pocket.app" --web-dir=.
        npx cap add android
        npx cap sync android

    - name: Build Debug APK
      run: |
        cd android && ./gradlew assembleDebug

    - name: Upload APK Download Link
      uses: actions/upload-artifact@v4
      with:
        name: My-Static-Website-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
