name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    # कोर्डोवा टूल को इंस्टॉल करना
    - name: Install Cordova
      run: npm install -g cordova

    # Google Play Store के लिए config.xml बनाना (SDK Configuration के साथ)
    - name: Create config.xml with SDK Configuration
      run: |
        cat > config.xml << 'EOF'
        <?xml version='1.0' encoding='utf-8'?>
        <widget id="com.pocket.app" version="1.0.0" xmlns="http://www.w3.org/ns/widgets">
          <name>NotWeakMind</name>
          <description>Mental Health & Wellness App</description>
          <author email="dev@notweakmind.com" href="https://notweakmind.com/">Your Team</author>
          
          <!-- Android SDK Configuration for Google Play Store 2025 -->
          <preference name="android-minSdkVersion" value="24" />
          <preference name="android-targetSdkVersion" value="35" />
          <preference name="android-versionCode" value="1" />
          
          <!-- Performance & Security Settings -->
          <preference name="AutoHideSplashScreen" value="true" />
          <preference name="FadeSplashScreen" value="true" />
          <preference name="permissions" value="none" />
        </widget>
        EOF

    # एक नया एंड्रॉइड प्रोजेक्ट बनाना और आपकी वेबसाइट की फाइलों को उसमें डालना
    - name: Create Android Project
      run: |
        cordova create my-app com.pocket.app "NotWeakMind"
        rm -rf my-app/www/*
        cp -r * my-app/www/ 2>/dev/null || true
        cp config.xml my-app/
        cd my-app
        cordova platform add android

    # Debug APK फाइल को बिल्ड (Compile) करना - बिना signing के
    - name: Build Debug APK (Unsigned)
      run: |
        cd my-app
        cordova build android --debug

    # Unsigned APK को डाउनलोड के लिए उपलब्ध करना
    - name: Upload Unsigned Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: NotWeakMind-Unsigned-APK
        path: my-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    # Build Summary
    - name: Build Summary
      if: always()
      run: |
        echo "==============================================="
        echo "✓ Android APK Build Complete"
        echo "==============================================="
        echo "📦 Unsigned Debug APK: Ready for download"
        echo ""
        echo "अगले Steps (अपने PC पर):"
        echo "1. APK को download करो"
        echo "2. अपनी keystore से sign करो"
        echo "3. Google Play Store पर upload करो"
        echo ""
        echo "Signing command (PC पर):"
        echo "jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256"
        echo " -keystore release.keystore app-debug.apk my-key-alias"
        echo "==============================================="
