name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Cache Gradle & Android Dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create Android Project
      run: |
        cordova create my-app dev.aryanbarnvanshi.eduscreen "EduScreen"
        rm -rf my-app/www/*
        cp index.html manifest.json sw.js icon.svg sitemap.xml my-app/www/ 2>/dev/null || cp index.html my-app/www/
        cd my-app
        cordova platform add android
        echo "24" > platforms/android/android-sdk-min-level.txt

    - name: Build Debug APK (Unsigned)
      run: |
        cd my-app
        cordova build android --debug

    - name: Upload Unsigned Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: EduScreen-Unsigned-APK
        path: my-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Build Summary
      if: always()
      run: |
        echo "==============================================="
        echo "✓ EduScreen Android APK Build Complete"
        echo "==============================================="
        echo "📦 Min Android SDK: API 24 (Android 7.0+ Supported)"
        echo "==============================================="
