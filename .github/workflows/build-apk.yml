name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    # कोर्डोवा टूल को इंस्टॉल करना
    - name: Install Cordova
      run: npm install -g cordova

    # एक नया एंड्रॉइड प्रोजेक्ट बनाना और आपकी वेबसाइट की फाइलों को उसमें डालना
    - name: Create Android Project
      run: |
        cordova create my-app com.pocket.app "NotWeakMind"
        rm -rf my-app/www/*
        cp -r * my-app/www/ 2>/dev/null || true
        cd my-app
        cordova platform add android

    # असली APK फाइल को बिल्ड (Compile) करना
    - name: Build Debug APK
      run: |
        cd my-app
        cordova build android --debug

    # बनी हुई APK फाइल को आपके लिए डाउनलोड लिंक में बदलना
    - name: Upload APK Download Link
      uses: actions/upload-artifact@v4
      with:
        name: Not-Weak-Mind-APK
        path: my-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
        
