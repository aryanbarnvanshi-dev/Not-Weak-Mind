name: Build Android APK for Google Play Store

on:
  push:
    branches:
      - main

env:
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    # कोर्डोवा टूल को इंस्टॉल करना
    - name: Install Cordova
      run: npm install -g cordova

    # Google Play Store के लिए config.xml बनाना (SDK Configuration के साथ)
    - name: Create config.xml with SDK Configuration
      run: |
        cat > config.xml << 'EOF'
        <?xml version='1.0' encoding='utf-8'?>
        <widget id="com.pocket.app" version="1.0.0" xmlns="http://www.w3.org/ns/widgets">
          <name>NotWeakMind</name>
          <description>Mental Health & Wellness App</description>
          <author email="dev@notweakmind.com" href="https://notweakmind.com/">Your Team</author>
          
          <!-- Android SDK Configuration for Google Play Store 2025 -->
          <preference name="android-minSdkVersion" value="24" />
          <preference name="android-targetSdkVersion" value="35" />
          <preference name="android-versionCode" value="1" />
          
          <!-- Performance & Security Settings -->
          <preference name="AutoHideSplashScreen" value="true" />
          <preference name="FadeSplashScreen" value="true" />
          <preference name="permissions" value="none" />
          <preference name="GradlePluginGoogleServicesVersion" value="4.4.0" />
        </widget>
        EOF

    # एक नया एंड्रॉइड प्रोजेक्ट बनाना और आपकी वेबसाइट की फाइलों को उसमें डालना
    - name: Create Android Project
      run: |
        cordova create my-app com.pocket.app "NotWeakMind"
        rm -rf my-app/www/*
        cp -r * my-app/www/ 2>/dev/null || true
        cp config.xml my-app/
        cd my-app
        cordova platform add android

    # Keystore को सेटअप करना (Release APK के लिए)
    - name: Setup Keystore for Release Build
      run: |
        if [ ! -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-app/release.keystore
          echo "✓ Keystore setup successful"
        else
          echo "⚠ Warning: KEYSTORE_BASE64 secret not found. Skipping release build."
        fi

    # Release APK फाइल को बिल्ड (Compile) करना - Google Play Store के लिए
    - name: Build Release APK
      if: ${{ secrets.KEYSTORE_BASE64 != '' }}
      run: |
        cd my-app
        cordova build android --release -- \
          --keystore=./release.keystore \
          --storePassword=$KEYSTORE_PASSWORD \
          --alias=$KEY_ALIAS \
          --password=$KEY_PASSWORD

    # असली Debug APK फाइल को बिल्ड (Compile) करना (टेस्टिंग के लिए)
    - name: Build Debug APK
      run: |
        cd my-app
        cordova build android --debug

    # Release APK को आपके लिए डाउनलोड लिंक में बदलना
    - name: Upload Release APK
      if: ${{ secrets.KEYSTORE_BASE64 != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: NotWeakMind-Release-APK
        path: my-app/platforms/android/app/build/outputs/apk/release/app-release-signed.apk
        retention-days: 30

    # Debug APK को आपके लिए डाउनलोड लिंक में बदलना
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: NotWeakMind-Debug-APK
        path: my-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    # Build Summary
    - name: Build Summary
      if: always()
      run: |
        echo "==============================================="
        echo "✓ Android APK Build Complete"
        echo "==============================================="
        echo "Debug APK: Available for download"
        if [ ! -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "Release APK: Available for download (Google Play Store)"
        else
          echo "⚠ Release APK: Skipped (Configure secrets to enable)"
        fi
        echo "==============================================="
